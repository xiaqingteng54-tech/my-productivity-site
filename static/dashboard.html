<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>工作台 · 每日执行看板</title>
<meta name="color-scheme" content="light" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans:wght@600;700;800;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#EFEFEF;
  --panel:#FFFFFF;
  --panel-2:#F5F5F3;
  --line:rgba(49,87,98,.17);
  --line-2:rgba(49,87,98,.32);
  --ink:#1D3540;
  --mute:#4E6C77;
  --dim:#5C7479;
  --cyan:#E9631A;
  --emerald:#2A6459;
  --amber:#D97706;
  --rose:#C2410C;
  --violet:#315762;
  --display:"Chakra Petch","Noto Sans SC",-apple-system,"Segoe UI",sans-serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --wordmark:"Noto Sans","Noto Sans SC",-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--body);
  font-size:16px;
  line-height:1.72;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background-image:
    linear-gradient(to right,rgba(49,87,98,.05) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(49,87,98,.05) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(120% 90% at 50% 0,#000 15%,transparent 78%);
  -webkit-mask-image:radial-gradient(120% 90% at 50% 0,#000 15%,transparent 78%);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-3;pointer-events:none;
  background:
    radial-gradient(58vw 40vw at 6% -8%,rgba(233,99,26,.11),transparent 64%),
    radial-gradient(50vw 36vw at 96% 2%,rgba(49,87,98,.09),transparent 62%),
    radial-gradient(66vw 44vw at 50% 110%,rgba(233,99,26,.05),transparent 68%),
    linear-gradient(180deg,#F4F4F2,#EFEFEF 55%,#E8E8E6);
}
a{color:inherit;text-decoration:none}
::selection{background:rgba(233,99,26,.30);color:#FFFFFF}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:#E6E6E4}
::-webkit-scrollbar-thumb{background:rgba(49,87,98,.26);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(233,99,26,.45)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}

.bar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:18px;
  padding:0 clamp(14px,3vw,32px);height:64px;
  background:rgba(239,239,239,.92);
  backdrop-filter:blur(14px) saturate(140%);
  -webkit-backdrop-filter:blur(14px) saturate(140%);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{
  width:34px;height:34px;flex:none;display:grid;place-items:center;
  border:1px solid rgba(233,99,26,.42);border-radius:9px;
  background:linear-gradient(150deg,rgba(233,99,26,.16),rgba(233,99,26,.02));
  color:#B84C0D;font-family:var(--display);font-weight:700;font-size:15.5px;letter-spacing:.06em;
  box-shadow:0 0 0 3px rgba(233,99,26,.05), inset 0 1px 0 rgba(49,87,98,.24);
}
.brand-t{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand-t b{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.14em;color:var(--mute)}
.brand-t span{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;white-space:nowrap}
.status{
  display:flex;align-items:center;gap:9px;
  font-family:var(--mono);font-size:12.5px;letter-spacing:.1em;color:var(--mute);
  padding:5px 11px;border:1px solid var(--line);border-radius:20px;background:rgba(49,87,98,.04);
  white-space:nowrap;
}
.status .dot{width:6px;height:6px;border-radius:50%;background:var(--emerald);box-shadow:0 0 0 0 rgba(42,100,89,.6);animation:pulse 2.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(42,100,89,.5)}70%{box-shadow:0 0 0 7px rgba(42,100,89,0)}100%{box-shadow:0 0 0 0 rgba(42,100,89,0)}}
.status .sep{color:rgba(49,87,98,.26)}
.acts{margin-left:auto;display:flex;align-items:center;gap:8px}
.btn{
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  font-family:var(--mono);font-size:13px;letter-spacing:.06em;
  padding:7px 12px;border-radius:9px;
  border:1px solid var(--line-2);background:rgba(49,87,98,.06);color:var(--ink);
  transition:background .18s ease,border-color .18s ease,color .18s ease,transform .18s ease;
}
.btn:hover{background:rgba(233,99,26,.1);border-color:rgba(233,99,26,.38);color:#B84C0D}
.btn:active{transform:translateY(1px)}
.btn.ok{background:rgba(42,100,89,.14);border-color:rgba(42,100,89,.45);color:#1F5A4F}
.btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.wordmark{padding:clamp(6px,1.4vw,14px) 0 clamp(14px,2vw,20px);animation:rise .7s cubic-bezier(.2,.7,.25,1) both}
.wm{
  margin:0;font-family:var(--wordmark);font-weight:800;
  font-size:clamp(38px,5.4vw,60px);line-height:1.04;letter-spacing:-.028em;
  color:#12242C;white-space:nowrap;
}
.wm-sub{
  margin:12px 0 0;display:flex;align-items:center;gap:11px;flex-wrap:wrap;
  font-family:var(--mono);font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);
}
.wm-sub .wm-dot{width:26px;height:3px;border-radius:2px;background:var(--cyan);flex:none}
.wm-sub #wm-date{color:var(--ink);font-weight:600}
@media (max-width:760px){
  .wm{white-space:normal;font-size:clamp(30px,9vw,40px)}
  .wm-sub{font-size:11px;letter-spacing:.12em}
}
.shell{max-width:1280px;margin:0 auto;padding:clamp(16px,2.6vw,30px) clamp(14px,3vw,32px) 56px}
.lede{
  font-family:var(--mono);font-size:14px;line-height:1.9;color:var(--mute);
  margin:0 0 18px;padding-left:13px;border-left:2px solid rgba(233,99,26,.5);
}
.lede b{color:#B84C0D;font-weight:600}

.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:0 0 20px}
.kpi{
  position:relative;overflow:hidden;
  padding:14px 15px 15px;border:1px solid var(--line);border-radius:14px;
  background:linear-gradient(168deg,rgba(255,255,255,.9),rgba(255,255,255,0) 46%),var(--panel);
  box-shadow:0 1px 2px rgba(29,53,64,.06),0 10px 24px -20px rgba(29,53,64,.5);
  transition:border-color .2s ease,transform .2s ease,box-shadow .2s ease;
}
.kpi::after{content:"";position:absolute;left:0;top:0;height:2px;width:100%;opacity:.85;
  background:linear-gradient(90deg,var(--c),transparent 78%)}
.kpi:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:0 18px 34px -22px rgba(29,53,64,.45)}
.kpi dt{
  display:flex;align-items:center;gap:7px;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.13em;color:var(--mute);text-transform:uppercase;
}
.kpi dt i{width:5px;height:5px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 8px var(--c)}
.kpi dd{
  margin:8px 0 0;display:flex;align-items:baseline;gap:4px;
  font-family:var(--display);font-weight:600;font-size:38px;line-height:1;letter-spacing:-.01em;
  font-variant-numeric:tabular-nums;
}
.kpi dd .unit{font-family:var(--mono);font-size:12.5px;font-weight:400;color:var(--dim);letter-spacing:0}
.kpi .cap{margin-top:7px;font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.kpi{background:linear-gradient(168deg,rgba(255,255,255,.94),rgba(255,255,255,.42) 62%),var(--bg);
  border-color:var(--bd);box-shadow:0 1px 2px rgba(29,53,64,.05),0 12px 26px -20px var(--halo)}
.kpi dt{color:#4A5B64}
.kpi dd{color:var(--cd)}
.kpi dd .unit{color:#66767E}
.kpi .cap{color:#55666E;font-weight:600}
.kpi.c-cyan{--c:#DE8A0B;--bg:#FFF4DD;--bd:rgba(222,138,11,.26);--cd:#7A4400;--halo:rgba(222,138,11,.35)}
.kpi.c-rose{--c:#E2503C;--bg:#FFEBE7;--bd:rgba(226,80,60,.26);--cd:#7D1B12;--halo:rgba(226,80,60,.35)}
.kpi.c-amber{--c:#2F7BC4;--bg:#E8F2FC;--bd:rgba(47,123,196,.24);--cd:#163F6D;--halo:rgba(47,123,196,.32)}
.kpi.c-emerald{--c:#15996B;--bg:#E4F6EC;--bd:rgba(21,153,107,.24);--cd:#0B4C39;--halo:rgba(21,153,107,.32)}
.kpi.c-violet{--c:#6C4BC9;--bg:#F0ECFC;--bd:rgba(108,75,201,.24);--cd:#3B2480;--halo:rgba(108,75,201,.32)}
.kpi.alert{background:linear-gradient(168deg,rgba(255,255,255,.9),rgba(255,255,255,.3) 60%),#FFE0DA;
  border-color:rgba(226,80,60,.42)}
.kpi.alert dd{color:#7D1B12}
.kpi:hover{border-color:var(--c);box-shadow:0 18px 30px -22px var(--halo),0 0 0 1px var(--bd)}

.grid{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:14px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{
  position:relative;border:1px solid var(--line);border-radius:var(--r);
  background:linear-gradient(170deg,rgba(255,255,255,.92),rgba(255,255,255,0) 40%),var(--panel);
  box-shadow:0 1px 2px rgba(29,53,64,.05),0 12px 28px -24px rgba(29,53,64,.55);
  padding:16px 17px 17px;
}
.card::before{content:"";position:absolute;inset:0 0 auto;height:1px;border-radius:var(--r) var(--r) 0 0;
  background:linear-gradient(90deg,transparent,rgba(233,99,26,.55) 15%,rgba(49,87,98,.18) 55%,transparent)}
.sec-h{display:flex;align-items:center;gap:9px;margin:0 0 13px;min-height:22px}
.sec-h h2{
  margin:0;font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.16em;
  color:var(--ink);text-transform:uppercase;display:flex;align-items:center;gap:8px;
}
.sec-h h2::before{content:attr(data-idx);font-size:11.5px;color:var(--dim);letter-spacing:.05em}
.count{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:#B84C0D;
  padding:2px 7px;border-radius:5px;background:rgba(233,99,26,.1);border:1px solid rgba(233,99,26,.22);
}
.hint{margin-left:auto;min-width:0;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;color:var(--dim);
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.list{list-style:none;margin:0;padding:0}
.list li{
  display:flex;gap:11px;align-items:flex-start;
  padding:10px 0;border-bottom:1px dashed rgba(49,87,98,.12);
  transition:background .16s ease;
}
.list li:last-child{border-bottom:0;padding-bottom:2px}
.list li:first-child{padding-top:0}
.mark{
  width:13px;height:13px;flex:none;margin-top:4px;border-radius:3.5px;
  border:1.5px solid rgba(49,87,98,.45);background:rgba(49,87,98,.04);
  transition:border-color .16s ease,background .16s ease,box-shadow .16s ease;
}
.list li:hover .mark{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(233,99,26,.1)}
.mark.over{border-color:rgba(194,65,12,.75);background:rgba(194,65,12,.12)}
.list li:hover .mark.over{border-color:var(--rose);box-shadow:0 0 0 3px rgba(194,65,12,.12)}
.t-main{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.t-text{font-size:16.5px;color:#24404B;font-weight:500;line-height:1.6;word-break:break-word}
a.t-text{transition:color .16s ease}
a.t-text:hover{color:var(--cyan)}
.t-meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.badge{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;line-height:1.6;
  padding:1px 6px;border-radius:4px;border:1px solid var(--line);
  background:rgba(49,87,98,.06);color:var(--dim);white-space:nowrap;
}
.badge.over{color:#A8340A;border-color:rgba(194,65,12,.35);background:rgba(194,65,12,.1)}
.badge.due{color:#9A4B06;border-color:rgba(217,119,6,.32);background:rgba(217,119,6,.09)}
.badge.plain{color:var(--mute)}
.empty{
  font-family:var(--mono);font-size:13.5px;line-height:1.9;color:var(--dim);
  padding:14px;border:1px dashed rgba(49,87,98,.18);border-radius:10px;background:rgba(49,87,98,.03);
}

.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.proj{
  position:relative;display:flex;flex-direction:column;gap:9px;
  padding:12px 13px 11px;border:1px solid var(--line);border-radius:12px;
  background:linear-gradient(168deg,rgba(49,87,98,.06),rgba(49,87,98,0) 50%),var(--panel-2);
  transition:border-color .2s ease,transform .2s ease,box-shadow .2s ease,background .2s ease;
}
.proj:hover{border-color:rgba(233,99,26,.34);transform:translateY(-2px);
  box-shadow:0 16px 30px -22px rgba(29,53,64,.5),0 0 0 1px rgba(233,99,26,.08)}
.p-top{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.p-name{font-size:15.5px;font-weight:700;line-height:1.45;color:#12242C;word-break:break-word;letter-spacing:.01em}
.status{
  flex:none;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;
  padding:2px 6px;border-radius:4px;border:1px solid var(--line);
  background:rgba(49,87,98,.06);color:var(--mute);white-space:nowrap;
}
.status.run{color:#B84C0D;border-color:rgba(233,99,26,.3);background:rgba(233,99,26,.1)}
.status.done{color:#1F5A4F;border-color:rgba(42,100,89,.3);background:rgba(42,100,89,.1)}
.p-meter{height:4px;border-radius:3px;background:rgba(49,87,98,.14);overflow:hidden}
.p-meter span{display:block;height:100%;border-radius:3px;
  background:linear-gradient(90deg,rgba(233,99,26,.55),var(--cyan));
  box-shadow:0 0 10px rgba(233,99,26,.45);
  animation:grow .8s cubic-bezier(.2,.8,.25,1) both}
.p-meter.done span{background:linear-gradient(90deg,rgba(42,100,89,.5),var(--emerald));box-shadow:0 0 10px rgba(42,100,89,.4)}
@keyframes grow{from{transform:scaleX(.02);transform-origin:left}to{transform:scaleX(1);transform-origin:left}}
.p-foot{display:flex;align-items:baseline;gap:6px;font-family:var(--mono);font-size:11.5px;color:var(--dim);letter-spacing:.05em}
.p-foot b{font-family:var(--display);font-size:22px;font-weight:600;color:#315762;letter-spacing:0;font-variant-numeric:tabular-nums}
.p-foot .sp{margin-left:auto}

.dist{display:flex;flex-direction:column;gap:10px}
.dist-row{display:grid;grid-template-columns:88px 1fr 46px;align-items:center;gap:10px}
.dist-row .k{font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;color:var(--mute);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dist-row .track{height:5px;border-radius:3px;background:rgba(49,87,98,.12);overflow:hidden}
.dist-row .track span{display:block;height:100%;border-radius:3px;
  background:linear-gradient(90deg,rgba(233,99,26,.3),rgba(233,99,26,.92));
  box-shadow:0 0 8px rgba(233,99,26,.30);
  animation:grow .9s cubic-bezier(.2,.8,.25,1) both}
.dist-row .v{font-family:var(--display);font-size:15px;color:#3E5C67;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dist-row .v i{font-family:var(--mono);font-style:normal;font-size:10.5px;color:var(--dim);margin-left:3px}

.search{
  width:100%;margin:0 0 12px;padding:9px 12px;
  font-family:var(--mono);font-size:13.5px;color:var(--ink);
  background:var(--panel);border:1px solid var(--line);border-radius:9px;
  transition:border-color .18s ease,box-shadow .18s ease;
}
.search::placeholder{color:var(--mute);opacity:.85;letter-spacing:.03em}
.search:focus{outline:none;border-color:rgba(233,99,26,.45);box-shadow:0 0 0 3px rgba(233,99,26,.08)}
.navbox{max-height:330px;overflow-y:auto;padding-right:4px;margin-right:-4px}
.folder{margin-bottom:12px}
.folder h3{
  margin:0 0 6px;font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.13em;
  color:var(--cyan);text-transform:uppercase;display:flex;align-items:center;gap:7px;
}
.folder h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(233,99,26,.22),transparent)}
.folder ul{list-style:none;margin:0;padding:0}
.folder li{display:flex;align-items:center;gap:8px;border-radius:5px;transition:background .14s ease}
.folder li:hover{background:rgba(233,99,26,.06)}
.folder li a{
  flex:1;min-width:0;font-size:14px;color:#3E5C67;padding:4px 5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  transition:color .14s ease;
}
.folder li:hover a{color:#B84C0D}
.mini{flex:none;font-family:var(--mono);font-size:10.5px;color:#9A4B06;padding:1px 5px;
  border:1px solid rgba(217,119,6,.26);background:rgba(217,119,6,.08);border-radius:4px;white-space:nowrap}
.mini.none{color:var(--dim);border-color:transparent;background:none}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}
.tag{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:#B84C0D;cursor:pointer;
  padding:3px 7px;border-radius:5px;border:1px solid rgba(233,99,26,.26);background:rgba(233,99,26,.09);
  transition:all .16s ease;display:inline-flex;align-items:center;gap:4px;
}
.tag:hover{background:rgba(233,99,26,.18);transform:translateY(-1px)}
.tag .n{color:rgba(233,99,26,.45)}
.tag.off{color:var(--dim);border-color:var(--line);background:rgba(49,87,98,.05)}
.tag.off:hover{color:var(--mute);border-color:var(--line-2)}

.group{border-bottom:1px solid var(--line)}
.group:last-child{border-bottom:0}
.group summary{
  display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none;
  padding:11px 2px;font-family:var(--mono);font-size:13px;color:var(--mute);
  transition:color .16s ease;
}
.group summary::-webkit-details-marker{display:none}
.group summary::before{content:"▸";color:var(--cyan);font-size:10.5px;transition:transform .18s ease}
.group[open] summary::before{transform:rotate(90deg)}
.group summary:hover{color:var(--ink)}
.g-name{font-family:var(--body);font-size:15px;color:#2B4954;font-weight:500}
.g-src{font-size:10.5px;color:var(--dim);letter-spacing:.06em}
.g-count{margin-left:auto;font-size:11.5px;color:var(--dim);letter-spacing:.06em}
.group .list{padding:2px 2px 12px 14px}

.note{border-style:dashed;background:rgba(217,119,6,.03);border-color:rgba(217,119,6,.18)}
.note summary{
  cursor:pointer;list-style:none;font-family:var(--mono);font-size:12.5px;letter-spacing:.1em;
  color:#9A4B06;text-transform:uppercase;
}
.note summary::-webkit-details-marker{display:none}
.note-body{margin-top:11px;display:flex;flex-direction:column;gap:6px;
  font-family:var(--mono);font-size:13px;line-height:1.8;color:var(--mute)}
.note-body b{color:#9A4B06;font-weight:500}
footer{
  margin-top:24px;padding-top:16px;border-top:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.09em;color:var(--mute);text-transform:uppercase;
}
.stack{display:flex;flex-direction:column;gap:14px;margin-top:14px}

@media (max-width:1080px){
  .grid{grid-template-columns:1fr}

<script>
(function(){
  "use strict";

  var DATA = {};
  try { DATA = JSON.parse(document.getElementById("payload").textContent); } catch (e) { DATA = {}; }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  function arr(v){ return Array.isArray(v) ? v : []; }
  function num(v){ var n = Number(v); return isFinite(n) ? n : 0; }

  var stats = DATA.stats || {};
  var today = arr(DATA.today);
  var wmDate = document.getElementById("wm-date");
  if (wmDate) wmDate.textContent = DATA.generatedAtLabel || DATA.generatedAt || "";
  var projects = arr(DATA.projects);
  var nav = arr(DATA.nav);
  var tags = arr(DATA.tags);
  var inbox = arr(DATA.inbox);
  var groups = arr(DATA.restGroups);
  var health = arr(DATA.health);

  var todayLabel = String(DATA.generatedAtLabel || "");
  document.getElementById("today-label").textContent = todayLabel;

  var overdue = today.filter(function(t){ return num(t.overdueDays) > 0; }).length;
  var running = projects.filter(function(p){ return /进行|active|doing/i.test(String(p.status || "")); }).length;
  var doneP = projects.filter(function(p){ return /完成|done|closed/i.test(String(p.status || "")); }).length;

  var kpis = [
    {k:"今日到期", v:num(stats.todayCount), u:"项", cls:"c-cyan",    cap:"TODAY"},
    {k:"已逾期",   v:overdue,              u:"项", cls:"c-rose",    cap:"OVERDUE", alert: overdue > 0},
    {k:"未完成",   v:num(stats.openTasks), u:"项", cls:"c-amber",   cap:"OPEN TASKS"},
    {k:"项目",     v:num(stats.projectCount), u:"个", cls:"c-emerald", cap:"RUNNING " + running},
    {k:"笔记",     v:num(stats.noteCount), u:"篇", cls:"c-violet",  cap:"TAGS " + tags.length}
  ];
  document.getElementById("kpis").innerHTML = kpis.map(function(c){
    return '<div class="kpi ' + c.cls + (c.alert ? " alert" : "") + '">'
      + '<dt><i aria-hidden="true"></i>' + esc(c.k) + '</dt>'
      + '<dd>' + c.v + '<span class="unit">' + esc(c.u) + '</span></dd>'
      + '<div class="cap">' + esc(c.cap) + '</div>'
      + '</div>';
  }).join("");

  var parts = [];
  parts.push(today.length ? '今天 <b>' + today.length + '</b> 件事到期' : '今天没有到期任务');
  if (overdue > 0) parts.push('其中 <b>' + overdue + '</b> 件已逾期');
  if (running) parts.push('<b>' + running + '</b> 个项目在推进');
  if (doneP) parts.push('<b>' + doneP + '</b> 个已收口');
  document.getElementById("lede").innerHTML = parts.join(" · ") + "。";

  function taskLi(t){
    var badges = "";
    var d = num(t.overdueDays);
    if (t.due){
      if (d > 0) badges += '<span class="badge over">逾期 ' + d + ' 天 · ' + esc(t.due) + '</span>';
      else if (d === 0) badges += '<span class="badge due">今天 · ' + esc(t.due) + '</span>';
      else badges += '<span class="badge plain">' + esc(t.due) + '</span>';
    }
    if (t.legacy) badges += '<span class="badge plain">日期写法待统一</span>';
    if (t.sourceTitle) badges += '<span class="badge plain">' + esc(t.sourceTitle) + '</span>';
    return '<li>'
      + '<span class="mark' + (d > 0 ? " over" : "") + '" aria-hidden="true"></span>'
      + '<span class="t-main"><span class="t-text">' + esc(t.text) + '</span>'
      + '<span class="t-meta">' + badges + '</span></span>'
      + '</li>';
  }

  document.getElementById("today-count").textContent = today.length ? today.length + " 项" : "";
  document.getElementById("today-list").innerHTML = today.length
    ? '<ul class="list">' + today.map(taskLi).join("") + '</ul>'
    : '<div class="empty">今天没有到期任务 — 可以清一清收件箱，或者给项目补一条下一步。</div>';

  var grid = document.getElementById("proj-grid");
  document.getElementById("proj-count").textContent = projects.length ? projects.length + " 个" : "";
  if (!projects.length){
    grid.innerHTML = '<div class="empty">1-Projects 里还没有带任务的笔记。</div>';
  } else {
    grid.innerHTML = projects.map(function(p){
      var st = String(p.status || "未标注");
      var cls = /进行|active|doing/i.test(st) ? "run" : (/完成|done|closed/i.test(st) ? "done" : "");
      var pct = (p.progress == null) ? null : Math.max(0, Math.min(1, num(p.progress)));
      var w = (pct == null) ? 0 : Math.round(pct * 100);
      var doneCls = (pct === 1) ? " done" : "";
      var fig = (pct == null) ? '<b>—</b>' : '<b>' + w + '%</b>';
      var frac = (pct == null) ? "" : '<span>' + num(p.doneTasks) + '/' + num(p.totalTasks) + ' tasks</span>';
      return '<a class="proj" href="' + esc(p.href) + '">'
        + '<div class="p-top"><span class="p-name">' + esc(p.name) + '</span>'
        + '<span class="status ' + cls + '">' + esc(st) + '</span></div>'
        + '<div class="p-meter' + doneCls + '"><span style="width:' + w + '%"></span></div>'
        + '<div class="p-foot">' + fig + frac
        + '<span class="sp">' + esc(p.mtime || "") + '</span></div>'
        + '</a>';
    }).join("");
  }

  var distTotal = nav.reduce(function(a, g){ return a + arr(g.items).length; }, 0) || 1;
  document.getElementById("dist-body").innerHTML = nav.length
    ? nav.map(function(g){
        var n = arr(g.items).length;
        var w = Math.max(3, Math.round(n / distTotal * 100));
        return '<div class="dist-row"><span class="k" title="' + esc(g.folder) + '">' + esc(g.folder) + '</span>'
          + '<span class="track"><span style="width:' + w + '%"></span></span>'
          + '<span class="v">' + n + '<i>篇</i></span></div>';
      }).join("")
    : '<div class="empty">没有可统计的目录。</div>';

  document.getElementById("inbox-count").textContent = inbox.length ? inbox.length + " 条" : "";
  document.getElementById("inbox-list").innerHTML = inbox.length
    ? '<ul class="list">' + inbox.map(function(n){
        var b = "";
        if (n.rel) b += '<span class="badge plain">' + esc(n.rel) + '</span>';
        if (num(n.openTasks) > 0) b += '<span class="badge due">' + num(n.openTasks) + ' 项待办</span>';
        if (n.mtime) b += '<span class="badge plain">' + esc(n.mtime) + '</span>';
        return '<li><span class="t-main"><a class="t-text" href="' + esc(n.href) + '">' + esc(n.title) + '</a>'
          + '<span class="t-meta">' + b + '</span></span></li>';
      }).join("") + '</ul>'
    : '<div class="empty">收件箱是空的。</div>';

  var navBody = document.getElementById("nav-body");
  var activeTag = null;

  function renderNav(){
    var q = String(document.getElementById("q").value || "").trim().toLowerCase();
    var html = "", shown = 0;
    nav.forEach(function(g){
      var items = arr(g.items).filter(function(n){
        var tgs = arr(n.tags);
        if (activeTag && tgs.indexOf(activeTag) < 0) return false;
        if (!q) return true;
        var hay = String(n.title || "") + " " + String(n.rel || "") + " " + tgs.join(" ");
        return hay.toLowerCase().indexOf(q) >= 0;
      });
      if (!items.length) return;
      shown += items.length;
      html += '<div class="folder"><h3>' + esc(g.folder) + " · " + items.length + '</h3><ul>'
        + items.map(function(n){
            return '<li><a href="' + esc(n.href) + '" title="' + esc(n.rel || n.title) + '">' + esc(n.title) + '</a>'
              + (num(n.openTasks)
                  ? '<span class="mini">' + num(n.openTasks) + '</span>'
                  : '<span class="mini none">–</span>')
              + '</li>';
          }).join("")
        + '</ul></div>';
    });
    if (!shown) html = '<div class="empty">没有匹配的笔记。</div>';

    var chips = tags.slice(0, 12).map(function(t){
      var nm = String(t.name == null ? "" : t.name);
      return '<button type="button" class="tag' + (activeTag === nm ? "" : " off") + '" data-tag="' + esc(nm) + '">'
        + esc(nm) + '<span class="n">' + num(t.count) + '</span></button>';
    }).join("");
    if (chips) html += '<div class="tags">' + chips + '</div>';
    navBody.innerHTML = html;

    Array.prototype.forEach.call(navBody.querySelectorAll(".tag"), function(b){
      b.addEventListener("click", function(){
        var v = b.getAttribute("data-tag");
        activeTag = (activeTag === v) ? null : v;
        renderNav();
      });
    });
  }
  document.getElementById("q").addEventListener("input", renderNav);
  document.getElementById("nav-count").textContent = num(stats.noteCount) + " 篇";
  renderNav();

  var total = groups.reduce(function(a, g){ return a + arr(g.tasks).length; }, 0);
  document.getElementById("all-count").textContent = total ? total + " 项" : "";
  document.getElementById("all-list").innerHTML = groups.length
    ? groups.map(function(g, i){
        var srcs = [];
        arr(g.tasks).forEach(function(t){
          if (t.sourceFolder && srcs.indexOf(t.sourceFolder) < 0) srcs.push(t.sourceFolder);
        });
        return '<details class="group"' + (i === 0 ? " open" : "") + '><summary>'
          + '<span class="g-name">' + esc(g.title) + '</span>'
          + (srcs.length ? '<span class="g-src">' + esc(srcs.join(" / ")) + '</span>' : '')
          + '<span class="g-count">' + arr(g.tasks).length + ' 项</span></summary>'
          + '<ul class="list">' + arr(g.tasks).map(taskLi).join("") + '</ul></details>';
      }).join("")
    : '<div class="empty">没有其他未完成待办。</div>';

  if (health.length){
    document.getElementById("sec-health").style.display = "";
    document.getElementById("health-count").textContent = health.length + " 处";
    document.getElementById("health-body").innerHTML = health.map(function(h){
      return '<div>· <b>' + esc(h.file) + '</b> — ' + esc(h.issue) + '</div>';
    }).join("");
  }

  document.getElementById("gen-at").textContent = "GEN " + String(DATA.generatedAt || "");

})();
</script>

<script>
(function(){
  var root=document.documentElement;
  var fine=window.matchMedia('(hover:hover) and (pointer:fine)').matches;
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var still=root.classList.contains('no-anim')||reduce||!fine;

  if(!still){
    var els=[].slice.call(document.querySelectorAll('.lede,.kpi,.card'));
    els.forEach(function(el,i){el.classList.add('reveal');el.style.animationDelay=(i*42)+'ms';});
  }
  if(!fine||reduce) return;

  root.classList.add('fancy');
  var dot=document.getElementById('cur-dot');
  var ring=document.getElementById('cur-ring');
  var lbl=ring.querySelector('b');
  var mx=innerWidth/2,my=innerHeight/2,rx=mx,ry=my,seen=false;

  document.addEventListener('mousemove',function(e){
    mx=e.clientX;my=e.clientY;
    if(!seen){seen=true;rx=mx;ry=my;}
  },{passive:true});

  var CFG=[[ '.btn',.30,'点击'],['.tag',.24,'筛选'],['.proj',.07,'查看'],
           ['.kpi',.05,''],['.folder li',.10,'打开'],['.group summary',.06,'展开'],
           ['.search',0,'输入']];
  var mags=[];
  CFG.forEach(function(c){
    [].slice.call(document.querySelectorAll(c[0])).forEach(function(el){
      if(el.dataset.magReady) return;
      el.dataset.magReady='1';
      if(c[1]>0) el.setAttribute('data-mag','');
      mags.push({el:el,s:c[1],label:c[2],w:0,h:0,cx:0,cy:0,tx:0,ty:0});
    });
  });

  /* 用 offset 几何量缓存中心点，避免 transform 反噬测量 */
  function measure(){
    mags.forEach(function(m){
      var r=m.el.getBoundingClientRect();
      m.w=r.width; m.h=r.height;
      m.cx=r.left+m.tx+r.width/2;
      m.cy=r.top+m.ty+r.height/2;
    });
  }
  measure();
  addEventListener('resize',measure,{passive:true});
  addEventListener('scroll',measure,{passive:true});
  setTimeout(measure,500); setTimeout(measure,1400);

  var cur=null;
  document.addEventListener('mouseover',function(e){
    var t=e.target.closest('.btn,.tag,.proj,.folder a,.group summary,input,a');
    if(!t){ if(cur){ring.classList.remove('on');dot.classList.remove('on');lbl.textContent='';cur=null;} return; }
    if(t===cur) return;
    cur=t; ring.classList.add('on'); dot.classList.add('on');
    var m=null;
    for(var i=0;i<mags.length;i++){ if(mags[i].el===t||mags[i].el.contains(t)){m=mags[i];break;} }
    lbl.textContent=(m&&m.label)||(t.tagName==='A'?'打开':t.tagName==='INPUT'?'输入':'点击');
  });

  function frame(){
    rx+=(mx-rx)*.16; ry+=(my-ry)*.16;
    dot.style.transform='translate3d('+mx+'px,'+my+'px,0)';
    ring.style.transform='translate3d('+rx+'px,'+ry+'px,0)';
    for(var i=0;i<mags.length;i++){
      var m=mags[i];
      if(!m.s||!m.w) continue;
      var dx=mx-m.cx, dy=my-m.cy;
      var rad=Math.max(m.w,m.h)*.62+70;
      var dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<rad){
        var f=1-dist/rad, cap=Math.max(m.w,m.h)*.10+6;
        var tx=Math.max(-cap,Math.min(cap,dx*m.s*f));
        var ty=Math.max(-cap,Math.min(cap,dy*m.s*f));
        m.tx=tx; m.ty=ty;
        m.el.classList.remove('snap');
        m.el.style.transform='translate3d('+tx.toFixed(2)+'px,'+ty.toFixed(2)+'px,0)';
      }else if(m.tx||m.ty){
        m.tx=0;m.ty=0;
        m.el.classList.add('snap');
        m.el.style.transform='translate3d(0,0,0)';
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
